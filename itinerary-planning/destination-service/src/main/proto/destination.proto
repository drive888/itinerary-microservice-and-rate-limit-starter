syntax = "proto3";

package com.fanone.destination;

option java_package = "com.fanone.destination.grpc";
option java_outer_classname = "DestinationProto";
option java_multiple_files = true;

// 目的地gRPC服务 - RPC通信方式
service DestinationGrpcService {
    rpc GetDestination (DestinationRequest) returns (DestinationResponse);
    rpc ListDestinations (ListDestinationsRequest) returns (DestinationListResponse);
}

message DestinationRequest {
    int64 id = 1;
}

message DestinationResponse {
    int64 id = 1;
    string name = 2;
    string description = 3;
    string city = 4;
    string province = 5;
    string category = 6;
    double rating = 7;
    string openTime = 8;
    double ticketPrice = 9;
}

message ListDestinationsRequest {
    int32 pageNum = 1;
    int32 pageSize = 2;
    string city = 3;
    string category = 4;
}

message DestinationListResponse {
    repeated DestinationResponse destinations = 1;
    int64 total = 2;
}
