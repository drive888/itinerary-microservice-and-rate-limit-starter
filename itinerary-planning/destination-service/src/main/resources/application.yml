server:
  port: 8083

spring:
  application:
    name: destination-service
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/itinerary_planning?useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123
    type: com.alibaba.druid.pool.DruidDataSource
  cloud:
    alibaba:
      seata:
        tx-service-group: itinerary_tx_group
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: itinerary_tx_group
  enable-auto-data-source-proxy: true
  data-source-proxy-mode: AT
  registry:
    type: file
  config:
    type: file
  service:
    vgroup-mapping:
      itinerary_tx_group: default
    grouplist:
      default: localhost:8091

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info

grpc:
  server:
    port: 9083

amap:
  key: ${AMAP_KEY:your-amap-key}
  url: https://restapi.amap.com/v3/place/text
